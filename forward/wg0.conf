# Forward node Wireguard config

[Interface]
PrivateKey = # fwd_private.key
Address = 172.16.0.2/24
ListenPort = 13232
Table = off

# allow ip forward
PostUp = sysctl -w net.ipv4.ip_forward=1
PostUp = sysctl -w net.ipv4.conf.all.rp_filter=0
PostUp = sysctl -w net.ipv4.conf.wg0.rp_filter=0
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT
PostUp = iptables -A FORWARD -o wg0 -j ACCEPT
PostUp = iptables -A FORWARD -i wg0 -o wg0 -j ACCEPT
# route table for inbound traffic
PostUp = ip rule add from 172.16.0.1 table 100
PostUp = ip route add 172.16.0.3/32 dev wg0
# route to output peer
PostUp = ip route add 0.0.0.0/0 via 172.16.0.3 dev wg0 table 100
# remove rules when interface is down
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT
PostDown = iptables -D FORWARD -o wg0 -j ACCEPT
PostDown = iptables -D FORWARD -i wg0 -o wg0 -j ACCEPT
# drop table when interface is down
PostDown = ip rule del from 172.16.0.1 table 100

# peer (input)
[Peer]
PublicKey = # in_public.key
AllowedIPs = 172.16.0.1/32
#Endpoint = <input peer hostname or ip>:13231
PersistentKeepalive = 15

# peer (output)
[Peer]
PublicKey = # out_public.key
AllowedIPs = 172.16.0.3/32,0.0.0.0/0
Endpoint = #<output peer hostname or ip>:13233
PersistentKeepalive = 15