# Input node (Client) Wireguard config

[Interface]
PrivateKey = # in_private.key
Address = 172.16.0.1/24
ListenPort = 13231

# allow ip forward
PostUp = sysctl -w net.ipv4.ip_forward=1
PostUp = sysctl -w net.ipv4.conf.all.rp_filter=0
PostUp = sysctl -w net.ipv4.conf.wg0.rp_filter=0
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT
PostUp = iptables -A FORWARD -o wg0 -j ACCEPT

# peer (forward)
[Peer]
PublicKey = # fwd_public.key
AllowedIPs = 0.0.0.0/0
# Endpoint = <forward peer hostname or ip>:13232
PersistentKeepalive = 15