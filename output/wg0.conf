# Output node Wireguard config

[Interface]
PrivateKey = # out_private.key
Address = 172.16.0.3/24
ListenPort = 13233

# allow ip forward
PostUp = sysctl -w net.ipv4.ip_forward=1
PostUp = sysctl -w net.ipv4.conf.all.rp_filter=0
PostUp = sysctl -w net.ipv4.conf.wg0.rp_filter=0
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT
PostUp = iptables -A FORWARD -o wg0 -j ACCEPT
# masquerade outgoing traffic to internet
PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
# remove rules when interface is down
PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT
PostDown = iptables -D FORWARD -o wg0 -j ACCEPT

# peer (forward)
[Peer]
PublicKey = # fwd_public.key
AllowedIPs = 172.16.0.1/32,172.16.0.2/32
# Endpoint = <forward peer hostname or ip>:13232
PersistentKeepalive = 15